<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodHub Admin - Quản lý</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .status-waiting { color: orange; font-weight: bold; }
        .status-preparing { color: blue; font-weight: bold; }
        .status-delivered { color: green; font-weight: bold; }
        .status-cancelled { color: red; font-weight: bold; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">FoodHub Admin Dashboard</span>
    </div>
</nav>

<div class="container my-5">
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#dishes">Quản lý món ăn</a></li>
        <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#orders">Quản lý đơn hàng</a></li>
    </ul>

    <div class="tab-content">
        <!-- Tab 1: Quản lý món ăn (giữ nguyên + cải thiện) -->
        <div class="tab-pane fade show active" id="dishes">
            <div class="card mb-4">
                <div class="card-body">
                    <h5 id="formTitle">Thêm món mới</h5>
                    <form id="dishForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3"><label class="form-label">Tên món</label><input type="text" class="form-control" id="name" required></div>
                        <div class="mb-3"><label class="form-label">Mô tả</label><input type="text" class="form-control" id="desc" required></div>
                        <div class="mb-3"><label class="form-label">Giá (đ)</label><input type="number" class="form-control" id="price" required min="1000"></div>
                        <div class="mb-3"><label class="form-label">Link hình ảnh</label><input type="url" class="form-control" id="img" placeholder="https://..." required></div>
                        <button type="submit" class="btn btn-primary">Lưu món</button>
                        <button type="button" id="cancelEdit" class="btn btn-secondary ms-2 d-none">Hủy sửa</button>
                    </form>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr><th>ID</th><th>Hình</th><th>Tên món</th><th>Mô tả</th><th>Giá</th><th>Hành động</th></tr>
                    </thead>
                    <tbody id="dishTable"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab 2: Quản lý đơn hàng (mới) -->
        <div class="tab-pane fade" id="orders">
            <h4>Danh sách đơn hàng từ khách</h4>
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Mã đơn</th>
                            <th>Ngày đặt</th>
                            <th>Khách hàng</th>
                            <th>Địa chỉ</th>
                            <th>SĐT</th>
                            <th>Món ăn</th>
                            <th>Tổng tiền</th>
                            <th>Thanh toán</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="orderTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ==================== Quản lý món ăn ====================
let dishes = JSON.parse(localStorage.getItem('adminDishes')) || [
    { id: 1, name: "Phở bò đặc biệt", desc: "Phở bò Hà Nội chuẩn vị", price: 65000, img: "https://www.seriouseats.com/thmb/J0g7JWjk9r6CHESo1CIrD1BfGd0=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/20231204-SEA-VyTran-BunChaHanoi-19-f623913c6ef34a9185bcd6e5680c545f.jpg" },
    { id: 2, name: "Bún chả Hà Nội", price: 55000, desc: "Thịt nướng thơm lừng", img: "https://www.seriouseats.com/thmb/eF08dIUavnPajC5DAb_Qz_lIS3c=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/20231204-SEA-VyTran-BunChaHanoi-21-e03d76ed609349c9aa0ed4a7385c87da.jpg" },
    // ... thêm các món khác nếu cần
];

function saveDishes() { localStorage.setItem('adminDishes', JSON.stringify(dishes)); renderDishes(); }

function renderDishes() {
    const tbody = document.getElementById('dishTable');
    tbody.innerHTML = '';
    dishes.forEach(dish => {
        const row = `
            <tr>
                <td>${dish.id}</td>
                <td><img src="${dish.img}" width="80" height="60" class="rounded" onerror="this.src='https://via.placeholder.com/80x60'"></td>
                <td>${dish.name}</td>
                <td>${dish.desc}</td>
                <td>${dish.price.toLocaleString('vi-VN')} đ</td>
                <td>
                    <button onclick="editDish(${dish.id})" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></button>
                    <button onclick="deleteDish(${dish.id})" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        tbody.innerHTML += row;
    });
}

document.getElementById('dishForm').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const newDish = {
        id: id ? parseInt(id) : Date.now(),
        name: document.getElementById('name').value,
        desc: document.getElementById('desc').value,
        price: parseInt(document.getElementById('price').value),
        img: document.getElementById('img').value
    };
    if (id) {
        const index = dishes.findIndex(d => d.id === parseInt(id));
        dishes[index] = newDish;
    } else {
        dishes.push(newDish);
    }
    saveDishes();
    resetForm();
});

function editDish(id) {
    const dish = dishes.find(d => d.id === id);
    document.getElementById('formTitle').textContent = 'Sửa món';
    document.getElementById('editId').value = dish.id;
    document.getElementById('name').value = dish.name;
    document.getElementById('desc').value = dish.desc;
    document.getElementById('price').value = dish.price;
    document.getElementById('img').value = dish.img;
    document.getElementById('cancelEdit').classList.remove('d-none');
}

function deleteDish(id) {
    if (confirm('Xóa món này?')) {
        dishes = dishes.filter(d => d.id !== id);
        saveDishes();
    }
}

function resetForm() {
    document.getElementById('dishForm').reset();
    document.getElementById('editId').value = '';
    document.getElementById('formTitle').textContent = 'Thêm món mới';
    document.getElementById('cancelEdit').classList.add('d-none');
}

document.getElementById('cancelEdit').addEventListener('click', resetForm);

// ==================== Quản lý đơn hàng ====================
function renderOrders() {
    const tbody = document.getElementById('orderTable');
    tbody.innerHTML = '';
    const orders = JSON.parse(localStorage.getItem('orders')) || [];
    
    if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted">Chưa có đơn hàng nào</td></tr>';
        return;
    }

    orders.forEach(order => {
        const itemsList = order.items.map(item => `${item.name} x${item.quantity}`).join('<br>');
        const row = `
            <tr>
                <td>FH-${order.id.toString().slice(-6)}</td>
                <td>${order.date}</td>
                <td>${order.customerName}</td>
                <td>${order.address}</td>
                <td>${order.phone}</td>
                <td>${itemsList}</td>
                <td>${order.total.toLocaleString('vi-VN')} đ</td>
                <td>${order.payment}</td>
                <td class="${order.status === 'Chờ xác nhận' ? 'status-waiting' : 
                           order.status === 'Đang chuẩn bị' ? 'status-preparing' : 
                           order.status === 'Đã giao' ? 'status-delivered' : 'status-cancelled'}">
                    ${order.status}
                </td>
                <td>
                    <select onchange="updateOrderStatus(${order.id}, this.value)" class="form-select form-select-sm">
                        <option value="Chờ xác nhận" ${order.status === 'Chờ xác nhận' ? 'selected' : ''}>Chờ xác nhận</option>
                        <option value="Đang chuẩn bị" ${order.status === 'Đang chuẩn bị' ? 'selected' : ''}>Đang chuẩn bị</option>
                        <option value="Đã giao" ${order.status === 'Đã giao' ? 'selected' : ''}>Đã giao</option>
                        <option value="Hủy" ${order.status === 'Hủy' ? 'selected' : ''}>Hủy</option>
                    </select>
                </td>
            </tr>`;
        tbody.innerHTML += row;
    });
}

function updateOrderStatus(orderId, newStatus) {
    let orders = JSON.parse(localStorage.getItem('orders')) || [];
    const order = orders.find(o => o.id === orderId);
    if (order) {
        order.status = newStatus;
        localStorage.setItem('orders', JSON.stringify(orders));
        renderOrders();  // Refresh bảng
        alert(`Đã cập nhật trạng thái đơn ${orderId} thành "${newStatus}"`);
    }
}

// Khởi chạy
renderDishes();
renderOrders();
</script>

</body>
</html>
