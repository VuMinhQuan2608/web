<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Ăn Ngon - Ẩm Thực Việt Nam</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
        .hero{
background:
linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

height:420px;
border-radius:20px;
color:white;
}
        .card-img-top { height: 220px; object-fit: cover; }
        .cart-sidebar { position: fixed; top: 0; right: -400px; width: 400px; height: 100%; background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.2); transition: right 0.3s ease; z-index: 1050; }
        .cart-sidebar.show { right: 0; }
        .dish-card { transition: transform 0.2s; }
        .dish-card:hover { transform: scale(1.03); }
    </style>
</head>
<body>

<!-- Navbar & Hero giữ nguyên -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">🍜 Món Ăn Ngon</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="#">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Khuyến mãi</a></li>
            </ul>
            <button id="cartBtn" class="btn btn-outline-light position-relative">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </button>
        </div>
    </div>
</nav>

<header class="hero d-flex align-items-center text-center">
    <div class="container">
        <h1 class="display-4 fw-bold">Tinh Hoa Ẩm Thực Việt</h1>
        <p class="lead">Thưởng thức Phở, Bún Chả, Cơm Tấm chuẩn vị ngay tại nhà</p>
        <a href="#menu" class="btn btn-primary btn-lg">Xem menu ngay</a>
    </div>
</header>

<section id="menu" class="py-5">
    <div class="container">
        <h2 class="text-center mb-4">🍜 Danh sách món ăn</h2>
        <div id="dishList" class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Render bằng JS -->
        </div>
    </div>
</section>

<!-- Giỏ hàng & Modal đặt hàng giữ nguyên như cũ -->

<div id="cartSidebar" class="cart-sidebar p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Giỏ hàng của bạn</h4>
        <button id="closeCart" class="btn btn-link text-dark"><i class="fas fa-times fa-2x"></i></button>
    </div>
    <div id="cartItems" class="mb-4"></div>
    <div class="border-top pt-3">
        <div class="d-flex justify-content-between mb-3">
            <strong>Tổng tiền:</strong>
            <strong id="cartTotal">0 đ</strong>
        </div>
        <button id="checkoutBtn" class="btn btn-success w-100">Đặt hàng ngay</button>
    </div>
</div>

<div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Xác nhận đặt hàng</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="orderForm">
                    <div class="mb-3">
                        <label class="form-label">Họ tên</label>
                        <input type="text" class="form-control" id="name" value="Nguyễn Văn A" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input type="tel" class="form-control" id="phone" value="0123456789" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Địa chỉ giao hàng</label>
                        <input type="text" class="form-control" id="address" value="123 Nguyễn Thị Minh Khai, Quận 1, TP.HCM" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phương thức thanh toán</label>
                        <select class="form-select" id="payment">
                            <option value="cod">Thanh toán khi nhận hàng (COD)</option>
                            <option value="bank">Chuyển khoản ngân hàng</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button id="confirmOrderBtn" class="btn btn-primary">Xác nhận đặt hàng</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100">
    <div id="toast" class="toast" role="alert">
        <div class="toast-body bg-success text-white"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // DỮ LIỆU MÓN ĂN - ĐÃ CẬP NHẬT HÌNH ẢNH THỰC TẾ
    const dishes = [
        { 
            id: 1, 
            name: "Phở bò đặc biệt", 
            price: 65000, 
            desc: "Phở bò Hà Nội chuẩn vị", 
            img: "https://upload.wikimedia.org/wikipedia/commons/5/53/Pho-Beef-Noodles-2008.jpg"
        },
        { 
            id: 2, name: "Bún chả Hà Nội", price: 55000, desc: "Thịt nướng thơm lừng, ăn kèm nước mắm chua ngọt", img: "https://c8.alamy.com/comp/2CME0C4/bun-cha-is-a-vietnamese-dish-of-grilled-pork-noodle-and-herb-closeup-in-the-plate-on-the-table-horizontal-2CME0C4.jpg"
        },
        { 
            id: 3, 
            name: "Cơm tấm sườn bì", 
            price: 45000, 
            desc: "Cơm tấm Sài Gòn", 
            img: "https://vickypham.com/wp-content/uploads/2022/12/905be-com-tam.jpg"
        },
        { 
            id: 4, 
            name: "Bánh mì thịt nướng", 
            price: 35000, 
            desc: "Bánh mì kẹp thịt", 
            img: "https://en-chatelaine.mblycdn.com/uploads/ench/2022/08/grilled-pork-banh-mi-social.jpg"
        },
        { 
            id: 5, 
            name: "Gỏi cuốn tôm thịt", 
            price: 40000, 
            desc: "Gỏi cuốn tươi ngon", 
            img: "https://i0.wp.com/vickypham.com/wp-content/uploads/2020/09/90a39-thumbnail-9264.jpg"
        },
        { 
            id: 6, 
            name: "Trà sữa trân châu", 
            price: 25000, 
            desc: "Trà sữa Đài Loan", 
            img: "https://statics.vinpearl.com/Vietnamese-Milk-Tea-1_1701613045.jpg"
        }
    ];

    let cart = [];

    // Render danh sách món ăn (Sprint 1)
    function renderDishes() {
        const container = document.getElementById('dishList');
        container.innerHTML = '';
        dishes.forEach(dish => {
            const card = `
                <div class="col">
                    <div class="card h-100 dish-card shadow-sm">
                        <img src="${dish.img}" class="card-img-top" alt="${dish.name}" onerror="this.src='https://via.placeholder.com/300x220?text=${dish.name}'">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${dish.name}</h5>
                            <p class="card-text text-muted">${dish.desc}</p>
                            <div class="mt-auto d-flex justify-content-between align-items-center">
                                <span class="fw-bold text-primary">${dish.price.toLocaleString('vi-VN')} đ</span>
                                <button onclick="addToCart(${dish.id})" class="btn btn-primary btn-sm">
                                    <i class="fas fa-plus"></i> Thêm
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
            container.innerHTML += card;
        });
    }

    // Các hàm còn lại giữ nguyên (addToCart, renderCart, changeQuantity, removeFromCart, showToast, v.v.)

    function addToCart(id) {
        const dish = dishes.find(d => d.id === id);
        const existing = cart.find(item => item.id === id);
        if (existing) {
            existing.quantity++;
        } else {
            cart.push({ ...dish, quantity: 1 });
        }
        updateCartCount();
        showToast(`${dish.name} đã được thêm vào giỏ!`);
    }

    function updateCartCount() {
        const count = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById('cartCount').textContent = count;
    }

    function renderCart() {
        const container = document.getElementById('cartItems');
        container.innerHTML = '';
        let total = 0;

        if (cart.length === 0) {
            container.innerHTML = `<p class="text-center text-muted">Giỏ hàng trống</p>`;
            document.getElementById('cartTotal').textContent = '0 đ';
            return;
        }

        cart.forEach((item, index) => {
            const subtotal = item.price * item.quantity;
            total += subtotal;
            const html = `
                <div class="d-flex mb-3 align-items-center">
                    <img src="${item.img}" width="60" height="60" class="rounded me-3" onerror="this.src='https://via.placeholder.com/60?text=${item.name}'">
                    <div class="flex-grow-1">
                        <div class="fw-bold">${item.name}</div>
                        <small class="text-muted">${item.price.toLocaleString('vi-VN')} đ × ${item.quantity}</small>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold">${subtotal.toLocaleString('vi-VN')} đ</div>
                        <button onclick="changeQuantity(${index}, -1)" class="btn btn-sm btn-outline-secondary">-</button>
                        <button onclick="changeQuantity(${index}, 1)" class="btn btn-sm btn-outline-secondary">+</button>
                        <button onclick="removeFromCart(${index})" class="btn btn-sm btn-outline-danger ms-2"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
            container.innerHTML += html;
        });

        document.getElementById('cartTotal').textContent = total.toLocaleString('vi-VN') + ' đ';
    }

    function changeQuantity(index, change) {
        cart[index].quantity += change;
        if (cart[index].quantity < 1) cart[index].quantity = 1;
        renderCart();
        updateCartCount();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        renderCart();
        updateCartCount();
    }

    const cartSidebar = document.getElementById('cartSidebar');
    document.getElementById('cartBtn').addEventListener('click', () => {
        renderCart();
        cartSidebar.classList.add('show');
    });
    document.getElementById('closeCart').addEventListener('click', () => {
        cartSidebar.classList.remove('show');
    });

    document.getElementById('checkoutBtn').addEventListener('click', () => {
        if (cart.length === 0) {
            showToast('Giỏ hàng trống!', 'danger');
            return;
        }
        cartSidebar.classList.remove('show');
        const modal = new bootstrap.Modal(document.getElementById('orderModal'));
        modal.show();
    });

    document.getElementById('confirmOrderBtn').addEventListener('click', () => {
        const name = document.getElementById('name').value;
        const address = document.getElementById('address').value;
        
        if (!name || !address) {
            showToast('Vui lòng điền đầy đủ thông tin!', 'danger');
            return;
        }

        setTimeout(() => {
            const modal = bootstrap.Modal.getInstance(document.getElementById('orderModal'));
            modal.hide();
            showToast(`Đặt hàng thành công! Mã đơn: FH-${Date.now().toString().slice(-6)}<br>Giao đến: ${address}`, 'success');
            cart = [];
            updateCartCount();
            renderCart();
        }, 800);
    });

    function showToast(message, type = 'success') {
        const toastEl = document.getElementById('toast');
        toastEl.querySelector('.toast-body').innerHTML = message;
        toastEl.className = `toast bg-${type} text-white`;
        const toast = new bootstrap.Toast(toastEl);
        toast.show();
    }

    // Khởi chạy
    window.onload = () => {
        renderDishes();
        updateCartCount();
    };
</script>

<footer class="bg-dark text-white py-4 text-center">
    <p>© 2026 FoodHub - Website đặt đồ ăn online (hình ảnh đã cập nhật chuẩn món ăn)</p>
</footer>

</body>
</html>
