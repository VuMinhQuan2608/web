<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Ăn Ngon - Ẩm Thực Việt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
        .navbar-brand { font-size: 1.6rem; }
        
        /* BACKGROUND ẨM THỰC (đã thay đúng như ảnh bạn đưa) */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.65)),
                        url('https://images.unsplash.com/photo-1563245372-f217cd3c99e4?auto=format&fit=crop&w=1920&q=80') 
                        center/cover no-repeat fixed;
            height: 70vh;
            min-height: 520px;
            color: white;
            text-shadow: 3px 3px 12px rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-content {
            max-width: 920px;
            text-align: center;
            padding: 30px;
        }
        .hero h1 {
            font-size: 4.2rem;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .hero p {
            font-size: 1.55rem;
            margin-bottom: 2.8rem;
        }
        .btn-hero {
            background-color: #c62828;
            border: none;
            font-size: 1.35rem;
            padding: 16px 50px;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(198,40,40,0.5);
        }
        .btn-hero:hover {
            background-color: #b71c1c;
            transform: translateY(-4px);
        }
        
        .card-img-top { height: 220px; object-fit: cover; }
        .dish-card {
            transition: all 0.3s;
            border: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }
        .dish-card:hover { transform: translateY(-12px); box-shadow: 0 15px 30px rgba(0,0,0,0.18); }
        
        .cart-sidebar {
            position: fixed; top: 0; right: -400px; width: 400px; height: 100%;
            background: white; box-shadow: -10px 0 25px rgba(0,0,0,0.25);
            transition: right 0.4s ease; z-index: 1050; overflow-y: auto;
        }
        .cart-sidebar.show { right: 0; }
        .toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 1100; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fas fa-utensils me-2"></i>Món Ăn Ngon</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="#">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="#menu">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Khuyến mãi</a></li>
            </ul>
            <button id="cartBtn" class="btn btn-outline-light position-relative">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
            </button>
        </div>
    </div>
</nav>

<header class="hero">
    <div class="hero-content">
        <h1>Tinh Hoa Ẩm Thực Việt</h1>
        <p>Thưởng thức Phở, Bún Chả, Cơm Tấm chuẩn vị ngay tại nhà</p>
        <a href="#menu" class="btn btn-hero btn-lg">Xem menu ngay</a>
    </div>
</header>

<section id="menu" class="py-5 bg-light">
    <div class="container">
        <h2 class="text-center mb-5 fw-bold"><i class="fas fa-bowl-rice me-2 text-danger"></i>Danh sách món ăn</h2>
        <div id="dishList" class="row row-cols-1 row-cols-md-3 g-4"></div>
    </div>
</section>

<div id="cartSidebar" class="cart-sidebar p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4><i class="fas fa-shopping-bag me-2"></i>Giỏ hàng của bạn</h4>
        <button id="closeCart" class="btn btn-link text-dark fs-3"><i class="fas fa-times"></i></button>
    </div>
    <div id="cartItems" class="mb-4"></div>
    <div class="border-top pt-3">
        <div class="d-flex justify-content-between mb-3 fs-4">
            <strong>Tổng tiền:</strong>
            <strong id="cartTotal">0 đ</strong>
        </div>
        <button id="checkoutBtn" class="btn btn-success w-100 py-3 fw-bold">Đặt hàng ngay</button>
    </div>
</div>

<div class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const dishes = [
        { id: 1, name: "Phở bò đặc biệt", price: 65000, desc: "Phở bò Hà Nội chuẩn vị", img: "https://images.unsplash.com/photo-1559847844-d4d257902454?auto=format&fit=crop&w=800&q=80" },
        { id: 2, name: "Bún chả Hà Nội", price: 55000, desc: "Thịt nướng thơm lừng, ăn kèm nước mắm chua ngọt", img: "https://c8.alamy.com/comp/2CME0C4/bun-cha-is-a-vietnamese-dish-of-grilled-pork-noodle-and-herb-closeup-in-the-plate-on-the-table-horizontal-2CME0C4.jpg" },
        { id: 3, name: "Cơm tấm sườn bì", price: 45000, desc: "Cơm tấm Sài Gòn nóng hổi", img: "https://vickypham.com/wp-content/uploads/2022/12/905be-com-tam.jpg" },
        { id: 4, name: "Bánh mì thịt nướng", price: 35000, desc: "Bánh mì Việt Nam pate, rau thơm", img: "https://images.unsplash.com/photo-1559054663-e8d23213f55c?auto=format&fit=crop&w=800&q=80" },
        { id: 5, name: "Gỏi cuốn tôm thịt", price: 40000, desc: "Gỏi cuốn tươi ngon, chấm mắm nêm", img: "https://images.unsplash.com/photo-1627308595324-97f6e6d336ec?auto=format&fit=crop&w=800&q=80" },
        { id: 6, name: "Trà sữa trân châu", price: 25000, desc: "Trà sữa thơm ngon, trân châu dai giòn", img: "https://images.unsplash.com/photo-1559591937-718a0c881f3f?auto=format&fit=crop&w=800&q=80" }
    ];

    let cart = [];

    function renderDishes() {
        const container = document.getElementById('dishList');
        container.innerHTML = '';
        dishes.forEach(dish => {
            container.innerHTML += `
                <div class="col">
                    <div class="card dish-card h-100">
                        <img src="${dish.img}" class="card-img-top" alt="${dish.name}">
                        <div class="card-body d-flex flex-column p-4">
                            <h5 class="card-title fw-bold">${dish.name}</h5>
                            <p class="card-text text-muted small">${dish.desc}</p>
                            <div class="mt-auto d-flex justify-content-between align-items-center">
                                <span class="fw-bold text-danger fs-5">${dish.price.toLocaleString('vi-VN')} đ</span>
                                <button onclick="addToCart(${dish.id})" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Thêm</button>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function addToCart(id) {
        const dish = dishes.find(d => d.id === id);
        const existing = cart.find(item => item.id === id);
        if (existing) existing.quantity++; else cart.push({...dish, quantity: 1});
        updateCartCount();
        showToast(`${dish.name} đã thêm vào giỏ!`);
    }

    function updateCartCount() {
        document.getElementById('cartCount').textContent = cart.reduce((sum, i) => sum + i.quantity, 0);
    }

    function showToast(message) {
        const toastContainer = document.querySelector('.toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast show bg-success text-white mb-3 shadow';
        toast.innerHTML = `<div class="toast-body">${message}</div>`;
        toastContainer.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    document.getElementById('cartBtn').addEventListener('click', () => document.getElementById('cartSidebar').classList.add('show'));
    document.getElementById('closeCart').addEventListener('click', () => document.getElementById('cartSidebar').classList.remove('show'));

    window.onload = () => {
        renderDishes();
        updateCartCount();
    };
</script>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <p>© 2026 Món Ăn Ngon - Mang tinh hoa ẩm thực Việt đến bàn ăn của bạn</p>
</footer>

</body>
</html>
